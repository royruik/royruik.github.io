<!DOCTYPE html>
<html>

  <body>

	<h1>Survey</h1>
	<form id="myform" action="index.php" >
	<br>
	<br>
	<h2>What do you think of the UI in this <a href="https://www.mcdonalds.com/ca/en-ca.html">McDonald's</a> site?</h2>	
	<br>
	<br>
	<! You should make your image clickable  red da291c>
	<a href="https://www.mcdonalds.com/ca/en-ca.html">
	  <img src="images/McDonalds-FrontPage.png" alt="McDonald's Front Page" width="450" height="525">
	</a>

	<br>
	<br>
	<div class="question">
	<h2> Personal Information </h2>
	<p>First name: <input type="text" name="firstname"></p>
	<p>Last name: <input type="text" name="lastname"></p>
	<br>
	<br>
		
	</div>	
		
	<div class="question">
		<h2> What you like </h2>
		I like:<br>
		<input type="checkbox" name="Color" value="Red">Red<br>
		<input type="checkbox" name="Color" value="Green">Green<br>
		<input type="checkbox" name="Color" value="Blue">Blue<br>
		
		<br>
		
		What is your favorite fruit?<br>
		<select id="favorite">
			<option value="Apples" selected="selected">Apples</option>
			<option value="Oranges">Oranges</option>
			<option value="Bananas">Bananas</option>
		</select>
	</div>
	
	<br>
	<br>
		
	Comments:<br>
	<textarea rows="5" cols="30"></textarea>
			
	<br>
	<br>
			
	<button id="submitButton" type="button" class="block">
		SUBMIT your questionnaire
	</button>

	</form>
